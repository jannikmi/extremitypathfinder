[package]
name = "polyanya-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Benchmark harness only: not part of the Python package or its CI (issue #170).
[dependencies]
polyanya = { version = "=0.18.0", default-features = false }
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
