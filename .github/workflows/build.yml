name: build

on:
  # allows running this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # By default, GitHub will maximize the number of jobs run in parallel
      # depending on the available runners on GitHub-hosted virtual machines.
      # max-parallel: 8
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            tox-env: py312,py312-numba,py312-minimum,py312-minimum-numba,docs
          - python-version: "3.13"
            tox-env: py313,py313-numba,py313-minimum,py313-minimum-numba
          - python-version: "3.14"
            tox-env: py314,py314-numba,py314-minimum,py314-minimum-numba
    env:
      TOXENV: ${{ matrix.tox-env }}
      TOX_SKIP_MISSING_INTERPRETERS: False

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pre-commit hook
        if: matrix.python-version == '3.12'
        uses: pre-commit/action@v3.0.1

      - name: Install test dependencies
        run: python -m pip install --upgrade pip tox

      - name: Run tox
        run: tox

  release-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip poetry
          poetry build --clean --no-interaction

      - name: Validate installed release artifacts
        run: python scripts/validate_release.py dist --version "$(poetry version -s)"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, release-validation]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          pip install poetry

      - name: Fetch version
        id: fetch_version
        run: echo "version_nr=$(poetry version -s)" >> $GITHUB_OUTPUT

      - name: Verify release tag and version availability
        env:
          VERSION: ${{ steps.fetch_version.outputs.version_nr }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${VERSION}."
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/extremitypathfinder/${VERSION}/json")
          if [ "${status}" = "200" ]; then
            echo "extremitypathfinder ${VERSION} already exists on PyPI."
            exit 1
          fi
          if [ "${status}" != "404" ]; then
            echo "Could not verify PyPI version availability (HTTP ${status})."
            exit 1
          fi

      - name: Build a binary wheel and a source tarball
        run: |
          poetry build --clean --no-interaction

      - name: Validate installed release artifacts
        run: python scripts/validate_release.py dist --version "${{ steps.fetch_version.outputs.version_nr }}"

      - name: Create draft GitHub release
        id: create_gh_release
        uses: ncipollo/release-action@v1
        env:
          VERSION: ${{ steps.fetch_version.outputs.version_nr }}
        with:
          tag: ${{env.VERSION}}
          name: Release ${{env.VERSION}}
          artifacts: "dist/*"
          allowUpdates: true
          draft: true
          prerelease: false

      - name: PyPI Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_DEPLOYMENT_API_KEY }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.fetch_version.outputs.version_nr }}
        run: gh release edit "${VERSION}" --draft=false
