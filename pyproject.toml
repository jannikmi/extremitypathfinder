[project]
name = "extremitypathfinder"
version = "3.0.0"
description = "python package for fast shortest path computation on 2D polygon or grid maps"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jannik Kissinger", email = "github@michelfe.it" }]
requires-python = ">=3.12,<4"
keywords = ["path-planning", "path-finding", "shortest-path", "visibility", "graph", "polygon", "grid", "map", "robotics", "navigation", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
    "Topic :: Games/Entertainment"
]
dependencies = [
    "networkx>=3,<4",
    "numpy>=2.3.3,<3",
]

[project.optional-dependencies]
numba = [
    "numba>=0.63,<1",
]
# PolygonEnvironment.from_shapely()
shapely = [
    "shapely>=2.0.6,<3",
]

[project.scripts]
extremitypathfinder = "extremitypathfinder.command_line:main"

[project.urls]
Homepage = "https://extremitypathfinder.readthedocs.io/en/latest/"
Documentation = "https://extremitypathfinder.readthedocs.io/en/latest/"
Repository = "https://github.com/jannikmi/extremitypathfinder"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "tox",
]
# also required for running the tests
plot = ["matplotlib"]
benchmark = [
    # pinned: unmaintained, the benchmark results refer to exactly this version
    "pyvisgraph==0.2.1",
    # imported by pyvisgraph, but not declared as its dependency
    "tqdm",
    # cleaning of the world map, independent validation of the paths
    "shapely>=2.1,<3",
    "matplotlib",
]
docs = [
    "Sphinx",
    "sphinx-rtd-theme",
    # the contributing guide is written in Markdown
    "myst-parser",
    # the API documentation includes the plotting functions
    "matplotlib",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout: the package is not in a src/ directory
module-root = ""
# additional files of the source distribution
source-include = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "CHANGELOG.rst",
    "CITATION.cff",
    "CONTRIBUTING.md",
    "Makefile",
    "tests/*.py",
    "scripts/validate_release.py",
    "scripts/release.py",
    # imported by the tests
    "scripts/docs_figures.py",
    "example.json",
]

[tool.contributing-guide]
# checked by scripts/check_contributing_guide.py (pre-commit and tests), cf. docs/contributing/documentation.md
root = "docs/contributing"
max-words = 1000
# every file of the guide must be reachable from these files (relative to the project directory)
entry-points = ["CONTRIBUTING.md"]

# a page may exceed max-words only with a justified exception (path relative to root), e.g.:
# [tool.contributing-guide.exceptions."performance.md"]
# max-words = 1200
# reason = "why splitting or condensing it would make it worse"

[tool.pytest.ini_options]
# a bare `pytest` runs the test suite only (not scripts/ or prototypes/)
testpaths = ["tests"]

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4
isolated_build = true
envlist =
    py{312,313,314,315}{,-numba}
    py{312,313,314,315}-minimum{,-numba}

[testenv]
package = wheel
extras =
    shapely
    numba: numba
deps =
    pytest
    matplotlib
    minimum: networkx==3.0
    # the declared minimum versions
    py{312,313,314}-minimum: numpy==2.3.3
    py{312,313,314}-minimum-numba: numba==0.63.0
    # the oldest Shapely version working with these NumPy versions
    py{312,313}-minimum: shapely==2.0.6
    # the oldest Shapely version providing Python 3.14 wheels
    py314-minimum: shapely==2.1.2
    # the oldest versions providing Python 3.15 wheels
    py315-minimum: numpy==2.5.2
    py315-minimum-numba: numba==0.68.0
    py315-minimum: shapely==2.2.0
setenv =
    MPLBACKEND = Agg
    !numba: EXPECT_NUMBA = 0
    numba: EXPECT_NUMBA = 1
commands =
    python -m pip check
    python -m pytest {posargs}

[testenv:docs]
basepython = python3.12
extras =
deps =
    Sphinx
    sphinx-rtd-theme
    myst-parser
    matplotlib
commands =
    sphinx-build -d "{envtmpdir}{/}doctree" docs "{toxworkdir}{/}docs_out" --color -b html -W --keep-going

[testenv:release]
# the release tooling, independent of the package and its dependencies
basepython = python3.12
skip_install = true
extras =
deps =
    pytest
    uv
setenv =
    EXPECT_UV = 1
commands =
    python -m pytest tests/test_release.py {posargs}
"""
