[project]
name = "extremitypathfinder"
version = "3.0.0"
description = "python package for fast shortest path computation on 2D polygon or grid maps"
readme = "README.rst"
# utils.astar_path() is adapted from networkx (BSD-3-Clause)
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Jannik Kissinger", email = "github@michelfe.it" }]
requires-python = ">=3.12,<4"
keywords = ["path-planning", "path-finding", "shortest-path", "visibility", "graph", "polygon", "grid", "map", "robotics", "navigation", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
    "Topic :: Games/Entertainment"
]
dependencies = [
    "networkx>=3,<4",
    "numpy>=2.3.3,<3",
]

[project.optional-dependencies]
numba = [
    "numba>=0.63,<1",
    # Required for Numba's np.linalg.solve implementation.
    "scipy>=1.16.1,<2",
]

[project.scripts]
extremitypathfinder = "extremitypathfinder.command_line:main"

[project.urls]
Homepage = "https://extremitypathfinder.readthedocs.io/en/latest/"
Documentation = "https://extremitypathfinder.readthedocs.io/en/latest/"
Repository = "https://github.com/jannikmi/extremitypathfinder"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "tox",
]
# also required for running the tests
plot = ["matplotlib"]
docs = [
    "Sphinx",
    "sphinx-rtd-theme",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# flat layout: the package is not in a src/ directory
module-root = ""
# additional files of the source distribution
source-include = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "CHANGELOG.rst",
    "CONTRIBUTING.rst",
    "Makefile",
    "tests/*.py",
    "scripts/validate_release.py",
    "scripts/release.py",
    "example.json",
]

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 4
isolated_build = true
envlist =
    py{312,313,314,315}{,-numba}
    py{312,313,314,315}-minimum{,-numba}

[testenv]
package = wheel
extras =
    numba: numba
deps =
    pytest
    matplotlib
    minimum: networkx==3.0
    # the declared minimum versions
    py{312,313,314}-minimum: numpy==2.3.3
    py{312,313,314}-minimum-numba: numba==0.63.0
    py{312,313,314}-minimum-numba: scipy==1.16.1
    # the oldest versions providing Python 3.15 wheels
    py315-minimum: numpy==2.5.2
    py315-minimum-numba: numba==0.68.0
    py315-minimum-numba: scipy==1.18.1
setenv =
    MPLBACKEND = Agg
    !numba: EXPECT_NUMBA = 0
    numba: EXPECT_NUMBA = 1
commands =
    python -m pip check
    python -m pytest {posargs}

[testenv:docs]
basepython = python3.12
extras =
deps =
    Sphinx
    sphinx-rtd-theme
    matplotlib
commands =
    sphinx-build -d "{envtmpdir}{/}doctree" docs "{toxworkdir}{/}docs_out" --color -b html

[testenv:release]
# the release tooling, independent of the package and its dependencies
basepython = python3.12
skip_install = true
extras =
deps =
    pytest
    uv
setenv =
    EXPECT_UV = 1
commands =
    python -m pytest tests/test_release.py {posargs}
"""
