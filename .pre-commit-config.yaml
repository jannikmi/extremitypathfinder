repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast  # Is it valid Python?
      - id: debug-statements # no debbuging statements used
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      #            -   id: check-executables-have-shebangs
      - id: check-json
      - id: pretty-format-json
        args: [ "--autofix" ]
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: requirements-txt-fixer
      #            -   id: detect-aws-credentials
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # linter.
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [ black ]

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        exclude: ^(docs|scripts|tests)/
        # E203 whitespace before ':'
        args:
          - --max-line-length=120
          - --ignore=E203
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-tidy-imports

  - repo: https://github.com/mgedmin/check-manifest
    rev: "0.51"
    hooks:
      - id: check-manifest
        args: [ "--no-build-isolation", "--ignore",  "*.png,*.svg,docs/*,publish.py,readthedocs.yml,uv.lock,pyproject.toml.orig,setup.py,scripts/*,prototypes/*,benchmarks/*" ]
        additional_dependencies: [ numpy, "uv_build>=0.13.5,<0.14" ]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade

